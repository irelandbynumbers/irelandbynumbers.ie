# Irish-language titles and summaries for each topic. They appear at the top of
# each topic page once `approved` is set to true, after a fluent speaker has
# checked them. Until then they are drafts and do not appear on the site.
approved: false
topics:
  population:
    title: "Daonra"
    summary: "Cé mhéad duine atá ina gcónaí in Éirinn, cá bhfuil siad ina gcónaí, agus conas atá sé sin ag athrú."
  housing:
    title: "Tithíocht"
    summary: "Cé mhéad teach nua a thógtar, agus costas tithe le ceannach agus le ligean ar cíos."
  cost-of-living:
    title: "Costas maireachtála"
    summary: "Conas a d'athraigh praghsanna do thomhaltóirí, agus na costais is mó a d'ardaigh."
  economy:
    title: "An geilleagar agus obair"
    summary: "Poist, dífhostaíocht, tuilleamh agus méid an gheilleagair."
  education:
    title: "Oideachas"
    summary: "Scoileanna, daltaí agus pátrúnacht scoileanna."
  crime:
    title: "Coireacht"
    summary: "Coireacht a taifeadadh de réir cineáil, ó ghoid agus coireacht a bhaineann le gluaisteáin go hionsaí."
  public-finances:
    title: "Airgeadas poiblí"
    summary: "Cá as a dtagann airgead an Stáit, cad air a gcaitear é, agus cé mhéad atá dlite ag an Stát."
  transport:
    title: "Iompar"
    summary: "Sábháilteacht ar bhóithre, conas a thaistealaíonn daoine, úsáid iompair phoiblí, agus na gluaisteáin ar bhóithre na hÉireann."
  ai:
    title: "Intleacht shaorga"
    summary: "Conas a úsáideann gnólachtaí agus daoine IS, agus an méid leictreachais a úsáideann ionaid sonraí."
  childhood:
    title: "Óige"
    summary: "Cé mhéad leanbh atá in Éirinn, sláinte leanaí, agus leanaí faoi chúram."
  poverty:
    title: "Bochtaineacht agus neamhionannas"
    summary: "Cé mhéad duine atá i mbaol bochtaineachta nó gan bhunriachtanais, cé is mó a bhíonn thíos leis, agus cé chomh cothrom is atá ioncam roinnte."
  gender:
    title: "Comhionannas inscne"
    summary: "An bhearna phá idir na hinscní, mná agus fir ag obair, cúram gan phá, agus mná sa pholaitíocht agus i gceannasaíocht gnó."
  energy:
    title: "Fuinneamh"
    summary: "Fuinneamh in-athnuaite, foinsí leictreachais na hÉireann, spleáchas ar fhuinneamh allmhairithe, agus praghsanna leictreachais."
  agriculture:
    title: "Talmhaíocht agus bia"
    summary: "Feirmeacha agus feirmeoirí, beostoc agus bainne, aschur agus ioncam feirme, leasachán, feirmeoireacht orgánach agus cur amú bia."
  counties:
    title: "Contaetha"
    summary: "Daonra agus cíosanna i ngach ceann de na 26 contae."
  migration:
    title: "Imirce"
    summary: "Cé mhéad duine a thagann go hÉirinn agus a fhágann í, cá as a dtagann siad agus cá dtéann siad."
  health:
    title: "Sláinte"
    summary: "Cé chomh fada is a mhaireann daoine, agus conas a d'athraigh na príomhchúiseanna báis."
  environment:
    title: "Comhshaol agus aeráid"
    summary: "Astaíochtaí gás ceaptha teasa, cá as a dtagann siad, agus conas a sheasann Éire i gcomparáid leis an AE."
  irish-language:
    title: "An Ghaeilge"
    summary: "Cé mhéad duine a labhraíonn Gaeilge, cé chomh minic, agus sa Ghaeltacht."
