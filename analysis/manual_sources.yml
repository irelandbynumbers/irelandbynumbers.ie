# Data that the Friday update cannot fetch by itself, because the publisher
# has no download link that works for an automated job, or because the
# figures are typed into the code from a web page or report.
#
# Each Friday, tools/check_manual_sources.py lists every item whose
# `last_checked` date is more than `every_months` old, and the publish
# workflow opens (or updates) a GitHub issue called "Data to check by hand"
# and adds a comment to it, so GitHub sends an email each Friday while
# anything is due.
#
# When you have checked an item: download or check it, update the site if the
# figures have changed (or upload the file so Claude can), then set
# `last_checked` to today's date. The issue closes itself once nothing is due.
# An item with `last_checked: never` is not used on the site yet.

- name: Family leave in Ireland
  used_in: Childcare and family leave, Family leave page (LEAVE in analysis/childcare/make_charts.py)
  what: Weeks of maternity, adoptive, paternity, parent's and parental leave, and the weekly benefit rate. Also check whether surrogacy leave has started.
  url: https://www.citizensinformation.ie/en/employment/employment-rights-and-conditions/leave-and-holidays/
  when: After each Budget in October, and in January when new rates start.
  every_months: 6
  last_checked: 2026-11-17

- name: Family leave in Northern Ireland
  used_in: Childcare and family leave, Family leave page (LEAVE in analysis/childcare/make_charts.py)
  what: Statutory maternity, paternity, adoption and parental leave and pay.
  url: https://www.nidirect.gov.uk/articles/statutory-maternity-leave
  when: Each April, when new UK rates start.
  every_months: 12
  last_checked: 2026-11-17

- name: Eurydice key data on early childhood education and care
  used_in: Childcare and family leave, The childcare gap, Childcare costs and Family leave pages (analysis/ibn/eurydice.py)
  what: Check for a new edition after the 2025 one. If there is one, give Claude the link to its open data workbook.
  url: https://eurydice.eacea.ec.europa.eu/publications
  when: A new edition comes out every few years.
  every_months: 12
  last_checked: 2026-11-17

- name: Pobal Early Years Sector Profile
  used_in: Not used yet. Would add childcare fees by county and by age, and numbers using the National Childcare Scheme and ECCE.
  what: Since 2021/22 the yearly report has been replaced by online dashboards with no download. Check whether a download or export has been added, or whether a Dáil reply gives fees by county. Reports from 2012 to 2020/21 were uploaded on 17 November 2026.
  url: https://www.pobal.ie/EarlyLearningandChildcaredata
  when: New programme-year data about once a year.
  every_months: 12
  last_checked: 2026-11-17

- name: OECD Family Database
  used_in: Not used yet. Would add a fuller comparison of leave and childcare costs with EU and OECD countries.
  what: PF2.1 Parental leave systems, and PF3.4 Childcare support (Excel files). Upload to the project.
  url: https://www.oecd.org/en/data/datasets/oecd-family-database.html
  when: Updated about once a year.
  every_months: 12
  last_checked: never

- name: International Review of Leave Policies and Research
  used_in: Not used yet. Would add leave entitlements country by country, including Ireland and the UK.
  what: The latest annual review (PDF) and any cross-country tables. Upload to the project.
  url: https://www.leavenetwork.org/annual-review-reports/
  when: Published once a year.
  every_months: 12
  last_checked: never

- name: Rape Crisis Ireland annual statistics
  used_in: Not used yet. Would add figures on people using rape crisis services, alongside the CSO figures on the Gender-based violence page.
  what: The latest annual statistics report (PDF). Upload to the project.
  url: https://www.rapecrisisireland.ie/
  when: Published once a year.
  every_months: 12
  last_checked: never

- name: Appropriation Accounts
  used_in: Public finances, Where public money goes page (analysis/data/per/appropriation_accounts_<year>.csv, read by analysis/public-finances/make_charts.py)
  what: Planned and actual spending on every subhead of every department, audited by the Comptroller and Auditor General. When the accounts for a new year are out, run analysis/public-finances/appropriation_accounts.py with the year and the link to the combined PDF, then set ACCOUNTS_YEAR in make_charts.py to the new year.
  url: https://www.audit.gov.ie/en/publications/appropriation-accounts/
  when: Each autumn, usually in September.
  every_months: 12
  last_checked: 2026-11-25
