project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*/*.qmd"
  resources:
    - CNAME
    - charts/**
    - images/**

website:
  title: "Ireland by Numbers"
  description: "Official Irish statistics in clear, interactive charts and maps."
  site-url: "https://irelandbynumbers.ie"
  repo-url: https://github.com/irelandbynumbers/irelandbynumbers.ie
  search: true
  image: images/social/site.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    left:
      - text: Topics
        menu:
          - href: population/index.qmd
            text: Population
          - href: housing/index.qmd
            text: Housing
          - href: cost-of-living/index.qmd
            text: Cost of living
          - href: economy/index.qmd
            text: Economy and work
          - href: education/index.qmd
            text: Education
          - href: crime/index.qmd
            text: Crime
          - href: migration/index.qmd
            text: Migration
          - href: health/index.qmd
            text: Health
          - href: environment/index.qmd
            text: Environment and climate
          - href: irish-language/index.qmd
            text: Irish language
      - href: counties/index.qmd
        text: Counties
      - href: charts.qmd
        text: All charts
      - href: chart-of-the-week.qmd
        text: Chart of the week
      - text: About
        menu:
          - href: about.qmd
            text: About the site
          - href: methods.qmd
            text: How figures are checked
          - href: glossary.qmd
            text: Glossary
          - href: whats-new.qmd
            text: What's new
          - href: corrections.qmd
            text: Corrections
          - href: data.qmd
            text: Data and code
    right:
      - icon: envelope
        href: mailto:irelandbynumbers@proton.me
        aria-label: Email
      - icon: github
        href: https://github.com/irelandbynumbers/irelandbynumbers.ie
        aria-label: GitHub
  page-footer:
    center: "Ireland by Numbers is independent and non-partisan · [How figures are checked](/methods.qmd) · [Corrections](/corrections.qmd) · Charts CC BY 4.0, code MIT · [Contact](mailto:irelandbynumbers@proton.me)"

format:
  html:
    theme: cosmo
    toc: false
    css: styles.css
    include-after-body: _includes/chart-frames.html
