    note: "Ireland's gross domestic product (GDP) is pushed up by the accounts of a number of large multinational companies, so the Central Statistics Office also publishes modified gross national income (GNI\\*), a measure of the domestic economy. In 2025, GNI\\* was €334 billion, a little over half of GDP."
