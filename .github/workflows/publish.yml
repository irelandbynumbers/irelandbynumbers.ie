on:
  push:
    branches: main
  schedule:
    - cron: "0 18 * * 5"   # every Friday evening, pick up the week's new releases
  workflow_dispatch:

name: Publish site

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On the weekly run (or a manual one), fetch the latest data, rebuild the
      # charts and county pages, redraw the tile thumbnails and link preview
      # images, and commit any change so the data history stays in the repository.
      # Each chart's page shows when its source was last updated and checked.
      - if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: github.event_name != 'push'
        uses: quarto-dev/quarto-actions/setup@v2
      - if: github.event_name != 'push'
        name: Refresh data and charts
        run: |
          pip install -r analysis/requirements.txt
          python3 analysis/build.py --refresh
          quarto render
          npm install --no-save playwright && npx playwright install --with-deps chromium
          node tools/thumbnails.js
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add analysis/data charts counties images/charts images/social _all-charts.md _data-updates.md
          git diff --cached --quiet || (git commit -m "Update data from source publishers" && git push)

      # Some sources can't be fetched by a job (see analysis/manual_sources.yml).
      # Keep one open issue listing those that are due, and add a comment to it
      # each Friday while anything is due, so GitHub sends an email notification.
      # Set the repository variable DATA_REMINDER_MENTION (for example "@name")
      # to mention someone in the weekly comment.
      - if: github.event_name != 'push'
        name: Remind about data to check by hand
        env:
          GH_TOKEN: ${{ github.token }}
          MENTION: ${{ vars.DATA_REMINDER_MENTION }}
        run: |
          python3 tools/check_manual_sources.py > due.md
          title="Data to check by hand"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -s due.md ]; then
            if [ -n "$number" ]; then gh issue edit "$number" --body-file due.md
            else number=$(gh issue create --title "$title" --body-file due.md | grep -o '[0-9]*$'); fi
            n=$(grep -c '^- \[ \]' due.md)
            gh issue comment "$number" --body "$MENTION Weekly reminder: $n data source(s) are due to be checked or downloaded by hand. The list is in the issue description above."
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Nothing is due to be checked by hand."
          fi

      - if: github.event_name == 'push'
        uses: quarto-dev/quarto-actions/setup@v2
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
